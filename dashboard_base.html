<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gestión de préstamos de controles de TV de la Clínica CES.">
  <title>{% block title %}Préstamos de Controles de TV{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css', v='loan-actions-20261019') }}&rev=26">
</head>
<body class="dashboard-page{% if active_page == 'traslado' %} transfer-page-shell{% endif %}">
  <div class="app-layout app-layout-single">
    <main class="dashboard-main dashboard-main-single">
      <header class="topbar topbar-single{% if active_page and active_page != 'inicio' and active_page != 'traslado' and active_page != 'historial' %} topbar-with-back{% endif %}">
        {% if active_page and active_page != 'inicio' and active_page != 'traslado' and active_page != 'historial' %}
        <button class="secondary-action global-back-button" type="button" onclick="if (history.length > 1) history.back(); else window.location.href='{{ url_for('dashboard') }}';" aria-label="Regresar a la página anterior">← Regresar</button>
        {% endif %}
        <a class="topbar-brand" href="{{ url_for('dashboard') }}" aria-label="Clínica CES">
          <img src="{{ url_for('static', filename='img/Logo.png') }}" alt="">
          <span>Clínica CES</span>
        </a>
        <div class="topbar-user"><span class="user-avatar">{{ usuario_nombre[0]|upper }}</span><span><strong>{{ usuario_nombre }}</strong><small>Ejecutivo de Cuenta</small></span><a class="dashboard-logout" href="{{ url_for('logout') }}">Cerrar sesión</a></div>
      </header>
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="{{ url_for('static', filename='dashboard_modular.js', v='loan-actions-20261019') }}&rev=18"></script>
</body>
</html>
